<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#424242"/><stop offset="100%" stop-color="#212121"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <circle cx="64" cy="64" r="56" fill="url(#bg)" filter="url(#shadow)"/>
  <path d="M64 36 L64 92 M36 64 L92 64" stroke="#616161" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#616161" stroke-width="2" opacity="0.3"/>

