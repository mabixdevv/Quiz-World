<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/shop.css">
    <script src="../js/shop.js" defer></script>
    <title>Shop</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="content">
                <div class="title">
                    <div class="wrap3">
                        <h1>Shop</h1>
                        <h2>Customize your profile!</h2>
                    </div>
       

                    <div class="wrap2">
                        <img src="../images/moneyIcon.png" alt="moneyIcon">
                        <span id="MoneyTxt">N/A</span>
                    </div>
                </div>

                <div class="wrap">
                    <div class="selector">
                        <div class="tab">
                            <span>Tags</span>
                        </div>

                        <div class="tab">
                            <span>Frames</span>
                        </div>

                        <div class="tab">
                            <span>Backgrounds</span>
                        </div>
                    </div>

                    <div class="cards">
                        <div class="card">
                            <img src="../images/FriendlyTag.png" alt="FriendlyTag">

                            <span>Friendly</span>

                            <button>20</button>
                        </div>

                        <div class="card">
                            <img src="../images/CuriousTag.png" alt="CuriousTag">

                            <span>Curious</span>

                            <button>20</button>
                        </div>

                        <div class="card">
                            <img src="../images/ChillTag.png" alt="ChillTag">

                            <span>Chill</span>

                            <button>20</button>
                        </div>

                        <div class="card">
                            <img src="../images/ChillTag.png" alt="ChillTag">

                            <span>Night Owl</span>

                            <button>50</button>
                        </div>

                        <div class="card">
                            <img src="../images/ChillTag.png" alt="ChillTag">

                            <span>Pirate</span>

                            <button>50</button>
                        </div>

                        <div class="card">
                            <img src="../images/ChillTag.png" alt="ChillTag">

                            <span>Mastermind</span>

                            <button>50</button>
                        </div>
                    </div>
                    

                    <button id="BackBt">Back to Menu</button>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
